[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whatsapp-pricing"
version = "0.1.0"
description = "Meta WhatsApp Business API per-message rates by country and category, with a monthly cost estimator. Pure stdlib, no network calls."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Tobachat" }]
keywords = ["whatsapp", "whatsapp-business-api", "pricing", "meta", "cost-calculator"]
classifiers = ["Typing :: Typed", "Programming Language :: Python :: 3"]
dependencies = []

[project.urls]
Homepage = "https://tobachat.nl/en/whatsapp-api-pricing-by-country/"
Repository = "https://github.com/tobachat/whatsapp-api-rates"

[tool.hatch.build.targets.wheel]
packages = ["src/whatsapp_pricing"]
